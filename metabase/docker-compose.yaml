services:
  metabase:
    image: metabase/metabase:v0.54.1
    container_name: metabase
    hostname: metabase
    volumes:
      - /dev/urandom:/dev/random:ro
    ports:
      - 3000:3000
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabaseappdb
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: mysecretpassword
      MB_DB_HOST: mb_postgres
      # Giới hạn JVM - đây là nguyên nhân chính Metabase chậm dần
      JAVA_OPTS: "-Xmx1500m -Xms512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+ExplicitGCInvokesConcurrent"
    networks:
      - dev-network
    healthcheck:
      test: curl --fail -I http://localhost:3000/api/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      mb_postgres:
        condition: service_healthy

  mb_postgres:
    image: postgres:15    # pin version
    container_name: mb_postgres
    hostname: mb_postgres
    ports:
      - 5435:5432
    environment:
      POSTGRES_USER: metabase
      POSTGRES_DB: metabaseappdb
      POSTGRES_PASSWORD: mysecretpassword
    volumes:
      - mb_postgres_data:/var/lib/postgresql/data
    command: >
      postgres
        -c shared_buffers=256MB
        -c effective_cache_size=512MB
        -c max_connections=50
        -c work_mem=8MB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=8MB
    deploy:
      resources:
        limits:
          memory: 768M
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "metabase"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always
    networks:
      - dev-network

volumes:
  mb_postgres_data:

networks:
  dev-network:
    external: true