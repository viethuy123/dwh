name: 'dwh_project'
version: '1.0.0'
config-version: 2

profile: 'dwh_project'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target/{{ target.name }}"
clean-targets:
  - "target/{{ target.name }}"
  - "dbt_packages"

models:
  dwh_project:
    dwh:
      intermediates:
        +schema: intermediates
        +materialized: table
      reports:
        +schema: reports
        +materialized: table
      dim:
        +schema: dim
        +materialized: table 
      fct:
        +schema: fct
        +materialized: table 
      bridge:
        +schema: bridge
        +materialized: table 


snapshots:
  dwh_project:
    snapshots:
      +target_schema: snapshots