version: 2

models:
  - name: dim_skill_level
    description: >
      [EN] Dimension table containing skill levels and their normalized grouping.
      Includes logic to standardize different naming conventions into consistent level groups.

      [VI] Bảng danh mục cấp độ kỹ năng.
      Bao gồm logic chuẩn hóa các tên level khác nhau thành nhóm level thống nhất.

    columns:
      - name: skill_level_id
        description: >
          [EN] Unique identifier of skill level.
          [VI] Mã cấp độ kỹ năng.

      - name: skill_type_id
        description: >
          [EN] Identifier of skill type. Foreign key to dim_skill_type.
          [VI] Mã loại kỹ năng. Khóa ngoại tới dim_skill_type.

      - name: level_name
        description: >
          [EN] Original level name (raw) as it appears in the source system.
          [VI] Tên cấp độ gốc từ hệ thống nguồn.

      - name: level_group
        description: >
          [EN] Normalized level group (e.g., Beginner, Intermediate, Advanced, etc.).
          Use this for cross-skill proficiency reporting.
          [VI] Nhóm cấp độ đã chuẩn hóa (ví dụ: Beginner, Intermediate, Advanced...). 
          Dùng trường này để báo cáo trình độ chung.

      - name: level_progress_percentage
        description: >
          [EN] Progress percentage associated with this level (0-100).
          [VI] Phần trăm tiến độ tương ứng với level.

      - name: is_default_level
        description: >
          [EN] Indicates if this is the default level assigned when none is specified.
          [VI] Đánh dấu level mặc định.

      - name: is_selectable
        description: >
          [EN] Indicates if this level is currently available for selection.
          [VI] Level còn có thể chọn được hay không.

      - name: etl_datetime
        description: >
          [EN] ETL processing timestamp. For pipeline monitoring only.
          [VI] Thời điểm xử lý ETL. Chỉ dùng cho monitoring pipeline.

    meta:
      semantic_type: dimension
      primary_key: skill_level_id
      grain:
        - skill_level_id

      # foreign_keys:
      #   - column: skill_type_id
      #     references: dim.dim_odoo_skill_type.id

      data_characteristics:
        contains_derived_fields: true
        normalized_dimension: true
        slowly_changing: true

      usage:
        preferred_for:
          - grouping skill levels for reporting
          - skill maturity analysis
          - comparing skill proficiency across different skill types
        avoid_for:
          - interpreting level_name as a standardized field (use level_group instead)
        warnings:
          - level_group is derived using pattern matching logic from level_name
          - New level_name values in source may fall into 'Other' if pattern logic is not updated
          - Always prioritize level_group for aggregated reporting

      synonyms:
        level_name:
          - cấp độ
        level_group:
          - nhóm cấp độ
          - trình độ
        level_progress_percentage:
          - phần trăm kỹ năng
          - "% trình độ"
        is_default_level:
          - mặc định
        is_selectable:
          - có thể chọn