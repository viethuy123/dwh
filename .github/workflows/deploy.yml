name: Deploy DWH Full Stack
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 
      
      - name: SSH and Smart Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 7001
          script: |
            set -e
            cd /home/user/warehouse
            
            BEFORE_SHA=$(git rev-parse HEAD)
            git pull origin main
            AFTER_SHA=$(git rev-parse HEAD)
            
            echo "🔍 Checking changes: $BEFORE_SHA → $AFTER_SHA"
            
            check_changes() {
              git diff --name-only $BEFORE_SHA $AFTER_SHA | grep -q "^$1/"
            }
            
            # 1. AIRFLOW
            if check_changes "airflow"; then
              echo ">>> Deploying Airflow..."
              cd airflow
              if git diff --name-only $BEFORE_SHA $AFTER_SHA | grep -qE "airflow/(Dockerfile|requirements.txt|docker-compose.yaml)|dbt/(packages.yml|dbt_project.yml)"; then
                docker compose up -d --build --force-recreate
              else
                echo "DAGs updated, Airflow will auto-reload"
              fi
              cd ..
            fi
            
            # 2. MYSQL
            if check_changes "mysql"; then
              echo ">>> Deploying MySQL..."
              cd mysql && docker compose up -d && cd ..
            fi
            
            # 3. POSTGRES
            if check_changes "postgre"; then
              echo ">>> Deploying Postgres..."
              cd postgre && docker compose up -d && cd ..
            fi
            
            # 4. MINIO
            if check_changes "minio"; then
              echo ">>> Deploying MinIO..."
              cd minio && docker compose up -d && cd ..
            fi
            
            # 5. METABASE
            if check_changes "metabase"; then
              echo ">>> Deploying Metabase..."
              cd metabase && docker compose up -d && cd ..
            fi
            
            echo "✅ Deploy completed!"
